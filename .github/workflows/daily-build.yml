name: Build, publish and notify

on:
  schedule:
    - cron: "17 5 * * *"   # every day ~06:17 Madrid (winter): refresh the calls feed
  push:
    branches: [main]
    paths: ["src/**"]      # a new or corrected article was pushed
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remember starting commit
        run: echo "START=$(git rev-parse HEAD)" >> $GITHUB_ENV
      - name: Build site (fetches the live Funding & Tenders feed)
        run: python3 src/build.py
      - name: Commit and push if anything changed
        run: |
          git config user.name "ullswater-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs src/data
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Rebuild $(date -u +%Y-%m-%d)" && git push; fi
      - name: Notify IndexNow (Bing and others)
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then BASE="$START"; fi
          python3 src/indexnow.py "$BASE..HEAD"
