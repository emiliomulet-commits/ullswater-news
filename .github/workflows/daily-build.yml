name: Daily rebuild (calls feed)

on:
  schedule:
    - cron: "17 5 * * *"   # every day ~06:17 Madrid (winter)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site (fetches the live Funding & Tenders feed)
        run: python3 src/build.py
      - name: Commit and push if anything changed
        run: |
          git config user.name "ullswater-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs src/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily rebuild $(date -u +%Y-%m-%d)"
          git push
